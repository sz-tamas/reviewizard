version: "0.5"

processes:
  backend:
    working_dir: .
    command: mise run dev:backend
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: ${REVIEWIZARD_BACKEND_PORT:-7777}
        path: /healthz
      initial_delay_seconds: 2
      period_seconds: 1
      timeout_seconds: 6
      failure_threshold: 180

  frontend:
    working_dir: .
    command: mise run dev:frontend
    environment:
      - "REVIEWIZARD_API_URL=http://127.0.0.1:${REVIEWIZARD_BACKEND_PORT:-7777}"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: ${REVIEWIZARD_FRONTEND_PORT:-5173}
        path: /
      initial_delay_seconds: 2
      period_seconds: 1
      timeout_seconds: 6
      failure_threshold: 30
    depends_on:
      backend:
        condition: process_healthy
