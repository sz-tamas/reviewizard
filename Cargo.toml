[package]
name = "reviewizard"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
build = "api/services/build.rs"

[lib]
path = "api/lib.rs"

[[bin]]
name = "reviewizard"
path = "api/main.rs"

[[test]]
name = "integration"
path = "api/services/tests/integration.rs"

[dependencies]
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "fs", "io-util", "sync"] }

chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.36", features = ["bundled"] }
mime_guess = "2"
percent-encoding = "2"
form_urlencoded = "1"
futures-util = "0.3"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
